// ***************************** SHOULD ONLY BE UPDATED/CHANGED TROUGH OUR PROTOREPO **********************************

syntax = "proto3";
option csharp_namespace = "Cbs.DataStore.Api";

import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";
import "google/protobuf/struct.proto";

service GrpcDataStoreApi {
	rpc IndexDataNode (IndexDataNodeRequest) returns (IndexDataNodeReply);

    rpc GetTheme(GetThemeRequest) returns (GetThemeResponse);
    rpc GetContent(GetContentRequest) returns (GetContentResponse);
	rpc GetIdentityContent(GetIdentityContentRequest) returns (GetContentResponse);

	rpc LoadDnHierarchy (LoadDnHierarchyRequest) returns (LoadDnHierarchyReply);

	rpc GetDbActor (GetDbActorRequest) returns (GetDbActorReply);

	rpc GetDataSharings (GetDataSharingsRequest) returns (GetDataSharingsReply);
    rpc GetSharedResourceGroups (GetSharedResourceGroupsRequest) returns (GetSharedResourceGroupsReply);
    rpc GetResourceGroupIdsByClaimIdentifiers (GetResourceGroupIdsByClaimIdentifiersRequest) returns (GetResourceGroupIdsByClaimIdentifiersReply);

	rpc ArchiveEmail (ArchiveEmailRequest) returns (ArchiveEmailReply);
	rpc ArchiveSms (ArchiveSmsRequest) returns (ArchiveSmsReply);
	rpc GetOutboundEmailSenderSettings (GetOutboundEmailSenderSettingsRequest) returns (GetOutboundEmailSenderSettingsReply);

	rpc GetCaseActorRoleActorIds (GetCaseActorRolesRequest) returns (GetCaseActorRolesReply);

	rpc StartGetEstateDataProcess (StartGetEstateDataProcessRequest) returns (StartGetEstateDataProcessReply);

	rpc GetCasePublicProfile (GetCasePublicProfileRequest) returns (GetCasePublicProfileReply);

	rpc GetActorById (GetActorByIdRequest) returns (GetActorByIdReply);
	rpc GetActorsByIds (GetActorsByIdsRequest) returns (GetActorsByIdsReply);
	rpc GetPrimaryEmailAccount (GetPrimaryEmailAccountRequest) returns (GetPrimaryEmailAccountReply);
	rpc GetBasicDataNode (GetBasicDataNodeRequest) returns (GetBasicDataNodeReply);
	rpc GetDataNodeContactInfo (GetDataNodeContactInfoRequest) returns (GetDataNodeContactInfoReply);
}

// Like DataNode.Api's ActorApi.GetActor: the actor's search document, not deleted. An empty permissions list applies
// no permission filter. Any datanode type matches, not only actors.
message GetActorByIdRequest {
	string actorId = 1;
	repeated string permissions = 2;
}

// actor is unset when nothing matches.
message GetActorByIdReply {
	IndexedActor actor = 1;
}

// Like DataNode.Api's ActorApi.GetActorsById: at most 1000 actors. An id that matches nothing is left out, and the
// order is not the order of actorIds.
message GetActorsByIdsRequest {
	repeated string actorIds = 1;
	repeated string permissions = 2;
}

message GetActorsByIdsReply {
	repeated IndexedActor actors = 1;
}

// An actor as the search index holds it. Strings are "" when the document has no value.
message IndexedActor {
	string id = 1;
	string namespace = 2;
	string displayName = 3;
	string firstName = 4;
	string lastName = 5;
	string resourceGroupId = 6;
	string tenantId = 7;
	// Unset unless the actor is archived.
	google.protobuf.Timestamp dataNodeArchivedAt = 8;
	repeated Email emails = 9;
	repeated Phone phones = 10;
	repeated Address addresses = 11;

	message Email {
		string address = 1;
		bool primary = 2;
	}

	// prefix, number and internationalNumber are normalised as DataNode.Api's were.
	message Phone {
		string prefix = 1;
		string number = 2;
		string internationalNumber = 3;
		bool primary = 4;
	}

	message Address {
		string displayName = 1;
		string streetName = 2;
		string streetNumber = 3;
		string floor = 4;
		string door = 5;
		string postalCode = 6;
		string city = 7;
		string countryCode = 8;
	}
}

// Like DataNode.Api's JsonApi.GetPersonalSettings, reduced to the one setting it returned.
message GetPrimaryEmailAccountRequest {
	string actorId = 1;
}

// found is false when the actor has no personal settings or no primary email account in them.
message GetPrimaryEmailAccountReply {
	bool found = 1;
	string primaryEmailAccountId = 2;
}

// Like DataNode.Api's DatanodeReferenceApi.GetDataNode: any datanode's search document, deleted ones included. An
// empty permissions list applies no permission filter. Fails with InvalidArgument for an invalid id and NotFound when
// nothing matches.
message GetBasicDataNodeRequest {
	string id = 1;
	repeated string permissions = 2;
}

message GetBasicDataNodeReply {
	BasicDataNode dataNode = 1;
}

message BasicDataNode {
	string id = 1;
	string namespace = 2;
	string displayName = 3;
	string externalId = 4;
	string resourceGroupId = 5;
	bool isDeleted = 6;
	repeated ExternalReference externalReferences = 7;
	repeated Taxon taxons = 8;

	message ExternalReference {
		string externalId = 1;
		string externalSystemNamespace = 2;
	}

	message Taxon {
		bool value = 1;
		google.protobuf.StringValue taxonNamespace = 2;
		google.protobuf.StringValue taxonomyNamespace = 3;
	}
}

// Like DataNode.Api's DatanodeReferenceApi.GetDataNodeContactInfo, with the same errors as GetBasicDataNode.
message GetDataNodeContactInfoRequest {
	string id = 1;
	repeated string permissions = 2;
}

// The datanode's email, address and phone, each picked as primary first, then verified, then the greatest address,
// display name or number. All three are always set; one the datanode does not have holds only empty strings.
message GetDataNodeContactInfoReply {
	Email email = 1;
	Address primaryAddress = 2;
	Phone primaryPhone = 3;

	message Email {
		string address = 1;
	}

	message Address {
		string displayName = 1;
		string streetName = 2;
		string streetNumber = 3;
		string floor = 4;
		string door = 5;
		string postalCode = 6;
		string city = 7;
		string countryCode = 8;
	}

	message Phone {
		string prefix = 1;
		string number = 2;
	}
}

message GetOutboundEmailSenderSettingsRequest {
	string actor_id = 1;
}

message GetOutboundEmailSenderSettingsReply {
	bool found = 1;
	string address = 2;
	string display_name = 3;
	bool verified = 4;
	bool enabled = 5;
}

message IndexDataNodeRequest {
	string data_node_id = 1;
	bool update = 2;
	bool instant_indexing = 3;
}

message IndexDataNodeReply {
}

message GetThemeRequest {
	string resourceGroupId = 1;
	string applicationId = 2;
	string theme_namespace = 3;
}

message GetThemeResponse {
	string json = 1;
}

message GetContentRequest {
	string resourceGroupId = 1;
	string applicationId = 2;
	string portalType = 3;
}

message GetIdentityContentRequest {
	string resourceGroupId = 1;
	string applicationId = 2;
	string application_namespace = 3;
}

message GetContentResponse {
	string json = 1;
}

message LoadDnHierarchyRequest {
  string resourceGroupId = 1;
  string actorId = 2;
  string namespace = 3;
}

message LoadDnHierarchyReply {
  string result = 1;
}

message GetDbActorRequest {
  string actorId = 1;
  reserved 2,3;
}

message GetDbActorReply {
	bool success = 1;
	string errorMessage = 2;
	ActorDto actor = 3;
}

message ActorDto {
	string id = 1;
	string resourceGroupId = 2;
	string displayName = 3;
	string timezoneId = 4;
	string role = 5;
	string roleStatus = 6;
	string namespace = 7;
	string imageUrl = 8;
	repeated ActorEmailDto emails = 9;
	repeated ActorIdentityDto identities = 10;
	repeated ActorPhoneDto phones = 11;
	string dataStoreId = 12;
}

message ActorIdentityDto {
	string identityId = 1;
	string createdById = 2;
	string createdAt = 3;
	string deletedById = 4;
	string deletedAt = 5;
	string flowType = 6;
}

message ActorPhoneDto {
	string phoneInformationElementId = 1;
	string prefix = 2;
	string number = 3;
	string internationalNumber = 4;
	string phoneType = 5;
	bool primary = 6;
	bool isVerified = 7;
	string phoneInformationElementNamespace = 8;
}

message ActorEmailDto{
	string address = 1;
	string emailInformationElementId = 2;
	bool primary = 3;
	bool isVerified = 4;
	string emailInformationElementNamespace = 5;
}

message GetDataSharingsRequest {
  string resourceGroupId = 1;
}

message GetDataSharingsReply {
  repeated DataSharingDto dataSharings = 1;
}

message DataSharingDto {
	string id = 1;
	string actorId = 2;
	string resourceGroupId = 3;
	string actorDisplayName = 4;
	google.protobuf.Timestamp createdAt = 5;
	string createdById = 6;
	google.protobuf.Timestamp sharingFromDate = 7;
	google.protobuf.Timestamp sharingToDate = 8;
	bool isDeleted = 9;
}


message GetSharedResourceGroupsRequest {
	string actorId = 1;
}

message GetSharedResourceGroupsReply{
	repeated string resourceGroupIds = 1;
}

// Like DataNode.Api's ResourceGroupClaimService: the resource groups whose claim identifier is one of these, at most
// 100, with no permission filter. Blank identifiers are ignored. Named apart from that service's messages, which
// DataNode.Api still compiles.
message GetResourceGroupIdsByClaimIdentifiersRequest {
	repeated string claimIdentifiers = 1;
}

message GetResourceGroupIdsByClaimIdentifiersReply {
	repeated string resourceGroupIds = 1;
}

message ArchiveEmailRequest {
	string body = 1;
	string parentId = 2;
	google.protobuf.Timestamp receivedAt = 3;
	repeated RecipientDto recipients = 4;
	string resourceGroupId = 5;
	string tenantId = 6;
	string senderEmail = 7;
	string subject = 8;
	string templateId = 9;
	string templateDisplayName = 10;
	string relatedCaseId = 11;
	ExecutingActorContext executingActorContext = 12;
	google.protobuf.StringValue sender_display_name = 13;
	google.protobuf.Timestamp email_sent_at = 14;
	bool isSystemEmail = 15;
	google.protobuf.StringValue email_provider = 16;

}

message ArchiveEmailReply {
	repeated string archives = 1;
}

message ArchiveSmsRequest {
	string displayName = 1;
	string body = 2;
	google.protobuf.Timestamp receivedAt = 3;
	repeated RecipientDto recipients = 4;
	repeated ArchiveOnDto archiveOn = 5;
	string templateId = 6;
	string templateTypeDisplayName = 7;
	string relatedCaseId = 8;

	ExecutingActorContext executingActorContext = 9;
}

message ArchiveSmsReply {
	repeated string archives = 1;
}

message RecipientDto {
	string email = 1;
	string displayName = 2;
}

message ArchiveOnDto {
	string tenantId = 1;
	string resourceGroupId = 2;
	string parentId = 3;
	string parentNamespace = 4;
}

message ExecutingActorContext {
	string actorId = 1;
	string actorNamespace = 2;
	string executingTenantId = 3;
	string executingResourceGroupId = 4;
	bool hasRootAccess = 5;
}

message GetCaseActorRolesRequest {
	string caseId = 1;
	repeated string roles = 2;
	bool onlyEmployees = 3;
}

message GetCaseActorRolesReply {
	repeated string actorIds = 1;
}

message StartGetEstateDataProcessRequest {
	string caseId = 1;
	string actorId = 2;
	repeated string taskNamespaces = 3;
}

message StartGetEstateDataProcessReply {
	bool success = 1;
	string processId = 2;
	string processNamespace = 3;
	string errorMessage = 4;
}

// Like DataNode.Api's CaseApi.GetPublicProfile: the case id is all it takes, and no permission filter applies.
message GetCasePublicProfileRequest {
	string caseId = 1;
}

// publicProfile is unset when the case is missing or deleted.
// The nested messages are copies, field for field, of datanode_api/case.proto and common/common.proto. PartnerHub
// stores CasePublicProfile as JSON keyed on the generated C# property names, so a field name must not change here.
// They are nested because these protos declare no package: top level, they would clash with case.proto's in every
// project that compiles both files.
message GetCasePublicProfileReply {
	CasePublicProfile publicProfile = 1;

	message CasePublicProfile {
		string id = 1;
		string namespace = 2;
		string displayName = 3;
		string parentId = 4;
		string parentNamespace = 5;
		string rootId = 6;
		string rootNamespace = 7;
		repeated string scopeNamespaces = 8;
		string scopeId = 9;
		string scopeNamespace = 10;
		string description = 11;
		string imageUrl = 12;
		string dataStoreId = 13;
		string resourceGroupId = 14;
		google.protobuf.Timestamp createdAt = 15;
		google.protobuf.Timestamp lastUpdatedAt = 16;
		google.protobuf.Timestamp executedAt = 17;
		google.protobuf.Timestamp scopeUpdatedAt = 18;
		string createdById = 19;
		string lastUpdatedById = 20;
		string executedById = 21;
		string scopeUpdatedById = 22;
		bool isDeleted = 23;
		repeated string namespaces = 24;
		string stateFlowNamespace = 25;
		string stateNamespace = 26;
		string stateCategoryNamespace = 27;
		string createdFromSource = 28;
		string agentId = 29;
		string agentDataStoreId = 30;
		int32 version = 31;
		int32 minorVersion = 32;
		string tenantId = 33;
		bool isPrimary = 34;
		bool hidden = 35;
		string verificationStateNamespace = 36;
		google.protobuf.Timestamp verificationExecutedAt = 37;
		bool isVerified = 38;
		string primaryResourceGroupId = 39;
		string stateReasonNamespace = 40;
		int32 price = 41;
		string priceNamespace = 42;
		string priceCurrency = 43;
		repeated Estate estates = 44;
		reserved 45;
		repeated Label labels = 46;
		string caseNumber = 47;
		PriceData priceData = 48;
		string externalId = 49;
		repeated ActorRoleReference actorRoleReferences = 50;
		string caseId = 51;
		string caseNamespace = 52;
		bool isExternal = 53;
		string agentDisplayName = 54;
		string agentPhone = 55;
		string agentEmail = 56;
		string agentImageUrl = 57;
		string externalPresentationUrl = 58;
		bool concealedListing = 59;
		bool underConstruction = 60;
		google.protobuf.Timestamp constructionReadyDate = 61;
		string advertisementAddress = 62;
	    double advertisementAddressLatitude = 63;
	    double advertisementAddressLongitude = 64;
		repeated Registration registrations = 65;
		PrimaryProposition PrimaryProposition = 66;
		repeated Distribution caseDistributionChannels = 67;
		NullableDateTimeOffset firstPublicDistributionDate = 68;
		NullableDateTimeOffset lastPublicDistributionDeactivationDate = 69;
		NullableDateTimeOffset totalPublicPeriodCalculationOffset = 70;
		bool publicDistributionActive = 71;
		bool includePublicDistributionInPublicProfile = 72;
		repeated EntityFeatureRegistration entityFeatureRegistrations = 73;
		repeated LawRegulation lawRegulations = 74;
		repeated ExternalReference externalReferences = 75;
		repeated string externalUrls = 76;
		string advertisementZipSource = 77;
		string advertisementZipSourceId = 78;
		string advertisementZipCountryCode = 79;
		string advertisementMunicipalitySource = 80;
		string advertisementMunicipalitySourceId = 81;
		string advertisementMunicipalityCountryCode = 82;
		AdvertisementZip advertisementZip = 83;
		AdvertisementMunicipality advertisementMunicipality = 84;
		repeated Appointment appointments = 85;
		google.protobuf.StringValue primaryPropositionEconomyNamespace = 86;
		repeated MediaItem mediaItems = 87;
		repeated TaxonPublicProfile taxons = 88;
	    repeated PublicDocument public_documents = 89;
	}

	message PublicDocument {
	    string id = 1;
		string namespace = 2;
	    string parent_id = 3;
	    string parent_namespace = 4;
	    string display_name = 5;
		string url = 6;
	 	google.protobuf.Timestamp last_updated_at = 7;
		google.protobuf.Timestamp created_at = 8;
	}

	message TaxonPublicProfile{
		bool value = 1;
		google.protobuf.StringValue taxon_namespace = 2;
		google.protobuf.StringValue taxonomy_namespace = 3;
		google.protobuf.StringValue note = 4;
	}

	message MediaItem{
		string displayName = 1;
		google.protobuf.StringValue description = 2;
		int32 priority = 3;
		google.protobuf.StringValue lg_url = 4;
		google.protobuf.StringValue md_url = 5;
		google.protobuf.StringValue xl_url = 6;
		google.protobuf.StringValue sm_url = 7;
		google.protobuf.StringValue xs_url = 8;
		string namespace = 9;
	}

	message ExternalReference{
		string externalId = 1;
		string externalSystemNamespace = 2;
	}

	message AdvertisementZip {
		string name = 1;
		string code = 2;
		string countryCode = 3;
		string source = 4;
		repeated AdvertisementMunicipality municipalities = 5;
	}

	message AdvertisementMunicipality {
		string name = 1;
		string code = 2;
		string countryCode = 3;
		string source = 4;
		string regionCode = 5;
		string regionName = 6;
	}

	message Distribution {
		string id = 1;
		string namespace = 2;
		string caseId = 3;
		bool active = 4;
		bool distributeWhenDisabled = 5;
		bool manuallyControlled = 6;
		bool public = 7;
		bool includeInPublicProfile = 8;
		NullableDateTimeOffset firstDistributionDate = 9;
		NullableDateTimeOffset totalPeriodCalculationOffset = 10;
		NullableDateTimeOffset lastDeactivationDate = 11;
		int32 totalDistributionDays = 12;
		repeated DistributionStateActivity stateHistory = 13;
		repeated DistributionPriceActivity priceHistory = 14;
	}

	message DistributionStateActivity {
		string id = 1;
		google.protobuf.Timestamp occurredAt = 2;
		NullableDateTimeOffset activeFrom = 3;
		NullableDateTimeOffset activeTo = 4;
	}

	message DistributionPriceActivity {
		string id = 1;
		google.protobuf.Timestamp occurredAt = 2;
		int32 price = 3;
		string priceCurrency = 4;
	}

	message PriceData {
		string id = 1;
		int32 version = 2;
		repeated PriceValue values = 3;

		message PriceValue {
			string namespace = 1;
			string currency = 2;
			int32 price = 3;
		}
	}

	message Label{
		string displayName = 1;
		string namespace = 2;
		string labelTitle = 3;
		string labelSubtitle = 4;
		string description = 5;
		google.protobuf.Timestamp eventStart = 6;
		google.protobuf.Timestamp eventEnd = 7;
		google.protobuf.Timestamp activeStart = 8;
		google.protobuf.Timestamp activeEnd = 9;
		bool setSpecificContent = 10;
		bool IsEvent = 11;
	}

	message Estate{
		string displayName = 1;
		string namespace = 2;
		string rootId = 3;
		bool isPrimary = 4;
		Address address = 5;
		repeated PropertyFactCollection propertyFacts = 6;
		repeated EnergyLabel energyLabels = 7;
		repeated string supplementalLegalEstateTypes = 8;
		repeated string alternativeEstateTypes = 9;
		bool isFlexProperty = 10;
		repeated Registration registrations = 11;
		repeated EntityFeatureRegistration entityFeatureRegistrations = 12;
		string id = 13;
		repeated TaxonPublicProfile taxons = 14;
		string typeDisplayName = 15;
	}

	message EntityFeatureRegistration {
		string displayName = 1;
		string namespace = 2;
		repeated EntityFeature entityFeatures = 3;
	}

	message EntityFeature {
		string displayName = 1;
		string namespace = 2;
		string comment = 3;
	}

	message Address {
		string sourceId = 1;
		string countryCode = 2;
		string displayName = 3;
		string streetNumber = 4;
		string floor = 5;
		string door = 6;
		string postalCode = 7;
		string city = 8;
		string propertyNumber = 9;
		string matrikelNumber = 10;
		string districtCode = 11;
		string districtName = 12;
		bool isVerified = 13;
		double latitude = 14;
		double longitude = 15;
		string street = 16;
		Municipality municipality = 17;
		string kvhx = 18;
		string source = 19;
		SupplementaryCityName supplementaryCity = 20;
	}

	message Municipality {
		string name = 1;
		string code = 2;
		string source = 3;
		string countryCode = 4;
	}

	message PropertyFactCollection {
		string id = 1;
		string namespace = 2;
		repeated PropertyFactsValue propertyFactsValues = 3;

		message PropertyFactsValue{
			string key = 1;
			string value = 2;
		}
	}

	message PrimaryProposition {
		string id = 1;
		string namespace = 2;
		repeated Registration registrations = 3;
	}

	message Registration {
		string id = 1;
		string namespace = 2;
		repeated FieldFragment fields = 3;
	}

	message FieldFragment {
		string fieldNamespace = 1;
		string fragmentNamespace = 2;
		string selectedSourceNamespace = 3;
		string fieldDataTypeNamespace = 4;
		string uomNamespace = 5;
		bool isCalculated = 6;
		string selectedValue = 7;
		repeated FieldFragmentValue values = 8;
	}

	message FieldFragmentValue {
		string sourceNamespace = 1;
		bool SelectedSource = 2;
		string value= 3;
	}

	message EnergyLabel {
		string id = 1;
		int32 version = 2;
		string namespace = 3;
		string displayName = 5;
		EnergyLabelData data = 6;

		message EnergyLabelData {
			string energyLabelSerialIdentifier = 1;
			string energyLabelClassification = 2;
			string submitterCompanyIdentifier = 3;
			string submitterConsultantName = 4;
			string submitterCompanyName = 5;
			google.protobuf.Timestamp validFrom = 6;
			google.protobuf.Timestamp validTo = 7;
			string demoLink = 8;
			string additionalHeat = 9;
			int32 calculatedConsumption = 10;
			string totalProfitableInvestment = 11;
			int32 extraCostPrYear = 12;
			string possibleEnergyLabelForAllProfitableProposals = 13;
			string heatSupply = 14;
			string id = 15;
			int32 version = 16;
			bool notRelevant = 17;
		}
	}

	message Appointment {
		string id = 1;
		string namespace = 2;
		string display_name = 3;
		NullableDateTimeOffset start = 4;
		NullableDateTimeOffset end = 5;
		ResponsibleAgent responsible_agent = 6;
	}

	message ResponsibleAgent {
		string id = 1;
		string display_name = 2;
	}

	message ActorRoleReference {
		string roleId = 1;
		string roleNamespace = 2;
		string referenceActorId = 3;
		string scopeId = 4;
		bool allowToViewInCustomerPortal = 5;
	}

	message NullableDateTimeOffset {
		oneof kind {
	    google.protobuf.NullValue null = 1;
	    google.protobuf.Timestamp value = 2;
	  }
	}

	message LawRegulation {
		string id = 1;
		string namespace = 2;
		repeated string activeLawRegulations = 3;
	}

	message SupplementaryCityName {
		string displayName = 1;
		string code = 2;
		string countryCode = 3;
		string source = 4;
	}
}
